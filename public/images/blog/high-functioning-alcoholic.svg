    <path d="M-52,170 c-18,7 -32,3 -38,-10 c14,-4 28,-4 38,10 Z" fill="#3C7E8E" opacity="0.85"/>
    <path d="M52,178 c18,7 32,0 36,-14 c-14,-6 -28,-3 -36,14 Z" fill="#3C7E8E" opacity="0.85"/>
  </g>
