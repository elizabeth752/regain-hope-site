<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="pma-title">
  <title id="pma-title">Stylized illustration of a prescription bottle with spilled pills, representing pain medication addiction</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F1E6EF"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A45"/>
      <stop offset="1" stop-color="#5C4326"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <circle cx="1000" cy="150" r="150" fill="#E6D6E6" opacity="0.5"/>
  <circle cx="1090" cy="480" r="190" fill="#D6C2DA" opacity="0.4"/>
  <circle cx="150" cy="500" r="120" fill="#BFDAE0" opacity="0.5"/>

  <!-- bottle, tilted -->
  <g transform="translate(430,110) rotate(-8 100 220)">
    <!-- cap -->
    <rect x="58" y="0" width="84" height="36" rx="8" fill="#3B1A3F"/>
    <rect x="66" y="10" width="10" height="18" fill="#2A1330"/>
    <rect x="86" y="10" width="10" height="18" fill="#2A1330"/>
    <rect x="106" y="10" width="10" height="18" fill="#2A1330"/>
    <rect x="126" y="10" width="10" height="18" fill="#2A1330"/>
    <!-- neck -->
    <path d="M74,36 h52 v28 h-52 z" fill="url(#bottle2)"/>
    <!-- body -->
    <path d="M40,64 c0,-8 8,-16 20,-16 h80 c12,0 20,8 20,16 v210 c0,20 -16,36 -36,36 h-48 c-20,0 -36,-16 -36,-36 z" fill="url(#bottle2)"/>
    <path d="M52,72 c0,-5 5,-10 12,-10 h6 v210 c0,12 -7,22 -17,26 z" fill="#C9A876" opacity="0.4"/>
    <!-- label -->
    <rect x="52" y="150" width="96" height="90" rx="8" fill="#FBF6EC"/>
    <line x1="66" y1="172" x2="134" y2="172" stroke="#C3A9C3" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="186" x2="134" y2="186" stroke="#C3A9C3" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="200" x2="110" y2="200" stroke="#C3A9C3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="222" r="10" fill="none" stroke="#C77B2B" stroke-width="2.5"/>
    <path d="M100,216 v8 M100,227 v1" stroke="#C77B2B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- spilled pills -->
  <g>
    <ellipse cx="330" cy="470" rx="26" ry="14" fill="#F7EFDD" stroke="#D6C2DA" stroke-width="2" transform="rotate(-15 330 470)"/>
    <line x1="315" y1="465" x2="345" y2="475" stroke="#D6C2DA" stroke-width="2"/>
    <ellipse cx="380" cy="510" rx="26" ry="14" fill="#3C7E8E" transform="rotate(20 380 510)"/>
    <ellipse cx="290" cy="520" rx="22" ry="12" fill="#7BB3BE" transform="rotate(-5 290 520)"/>
    <ellipse cx="820" cy="500" rx="24" ry="13" fill="#F7EFDD" stroke="#D6C2DA" stroke-width="2" transform="rotate(12 820 500)"/>
    <line x1="806" y1="497" x2="834" y2="503" stroke="#D6C2DA" stroke-width="2"/>
    <ellipse cx="870" cy="470" rx="20" ry="11" fill="#BFDAE0" transform="rotate(-18 870 470)"/>
  </g>
</svg>
