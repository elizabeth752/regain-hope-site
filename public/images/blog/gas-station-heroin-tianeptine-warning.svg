<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="gsh-title">
  <title id="gsh-title">Stylized illustration of a warning-labeled tianeptine bottle, representing gas station heroin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F1E6EF"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B496B"/>
      <stop offset="1" stop-color="#3B1A3F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="990" cy="140" r="150" fill="#E6D6E6" opacity="0.55"/>
  <circle cx="1080" cy="470" r="200" fill="#D6C2DA" opacity="0.4"/>
  <circle cx="140" cy="520" r="120" fill="#BFDAE0" opacity="0.5"/>

  <!-- bottle -->
  <g transform="translate(430,120)">
    <!-- cap -->
    <rect x="52" y="0" width="56" height="34" rx="8" fill="#3B1A3F"/>
    <rect x="60" y="30" width="40" height="16" fill="#2A1330"/>
    <!-- neck -->
    <path d="M64,46 h32 v34 h-32 z" fill="url(#bottle)"/>
    <!-- body -->
    <path d="M40,80 c0,-10 10,-20 24,-20 h32 c14,0 24,10 24,20 v240 c0,22 -18,40 -40,40 h0 c-22,0 -40,-18 -40,-40 z" fill="url(#bottle)"/>
    <!-- highlight -->
    <path d="M52,90 c0,-6 6,-12 14,-12 h6 v240 c0,14 -8,26 -20,30 z" fill="#8A6A8A" opacity="0.35"/>
    <!-- warning label band -->
    <rect x="30" y="200" width="100" height="86" rx="10" fill="#FBF6EC"/>
    <circle cx="80" cy="228" r="18" fill="#F1E6EF"/>
    <path d="M80,217 l11,20 h-22 z" fill="none" stroke="#C77B2B" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="80" y1="223" x2="80" y2="230" stroke="#C77B2B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="235" r="1.6" fill="#C77B2B"/>
    <line x1="46" y1="258" x2="114" y2="258" stroke="#C3A9C3" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="270" x2="100" y2="270" stroke="#C3A9C3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- caption-free accent: small pill capsules scattered -->
  <g fill="#3C7E8E" opacity="0.85">
    <ellipse cx="300" cy="470" rx="20" ry="9" transform="rotate(-25 300 470)"/>
    <ellipse cx="340" cy="500" rx="20" ry="9" transform="rotate(15 340 500)"/>
  </g>
  <g fill="#BFDAE0" opacity="0.9">
    <ellipse cx="900" cy="540" rx="20" ry="9" transform="rotate(-10 900 540)"/>
  </g>
</svg>
