<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="brwTitle">
  <title id="brwTitle">Nervous system rebound when benzodiazepines stop suddenly</title>
  <rect x="2" y="2" width="596" height="356" rx="16" fill="#FBF6EC" stroke="#E6D6E6" stroke-width="2"/>

  <!-- category labels -->
  <text x="160" y="26" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="600" fill="#3C7E8E">On medication — balanced</text>
  <text x="440" y="26" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="600" fill="#3F2C3F">Stops suddenly — rebound</text>

  <!-- calm wave -->
  <path d="M40,180 C65,165 90,195 115,180 C140,165 165,195 190,180 C215,165 240,195 265,180 C272,178 278,180 280,180"
        fill="none" stroke="#3C7E8E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- divider -->
  <line x1="290" y1="60" x2="290" y2="320" stroke="#55585A" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- jagged rebound wave -->
  <path d="M300,180 L330,90 L360,180 L390,270 L420,180 L450,90 L480,180 L510,270 L540,180 L570,180"
        fill="none" stroke="#3F2C3F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- apex markers -->
  <circle cx="330" cy="90" r="4.5" fill="#6B496B"/>
  <circle cx="390" cy="270" r="4.5" fill="#6B496B"/>
  <circle cx="450" cy="90" r="4.5" fill="#6B496B"/>
  <circle cx="510" cy="270" r="4.5" fill="#6B496B"/>

  <!-- leader lines -->
  <line x1="330" y1="90" x2="330" y2="70" stroke="#5A3F5A" stroke-width="1.5"/>
  <line x1="390" y1="270" x2="390" y2="290" stroke="#5A3F5A" stroke-width="1.5"/>
  <line x1="450" y1="90" x2="450" y2="70" stroke="#5A3F5A" stroke-width="1.5"/>
  <line x1="510" y1="270" x2="510" y2="290" stroke="#5A3F5A" stroke-width="1.5"/>

  <!-- chips above -->
  <rect x="285" y="42" width="90" height="26" rx="7" fill="#E6D6E6"/>
  <text x="330" y="59" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#19211F">Seizures</text>

  <rect x="390" y="42" width="120" height="26" rx="7" fill="#E6D6E6"/>
  <text x="450" y="59" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#19211F">Hallucinations</text>

  <!-- chips below -->
  <rect x="335" y="292" width="110" height="26" rx="7" fill="#E6D6E6"/>
  <text x="390" y="309" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#19211F">Severe panic</text>

  <rect x="445" y="286" width="130" height="38" rx="7" fill="#E6D6E6"/>
  <text x="510" y="301" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#19211F">Heart rate &amp;</text>
  <text x="510" y="315" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#19211F">BP changes</text>
</svg>
