<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="nf-title nf-desc">
  <title id="nf-title">Two forms of naltrexone</title>
  <desc id="nf-desc">Oral tablet ReVia taken once daily, and long-acting injection Vivitrol given about once every four weeks by a clinician.</desc>

  <!-- Left card: oral tablet -->
  <rect x="16" y="20" width="338" height="260" rx="18" fill="#FFFFFF" stroke="#E6D6E6" stroke-width="2"/>
  <text x="185" y="56" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6B496B">ORAL TABLET</text>

  <!-- pill icon -->
  <defs>
    <clipPath id="pillClip">
      <rect x="140" y="90" width="90" height="40" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pillClip)">
    <rect x="140" y="90" width="45" height="40" fill="#5A3F5A"/>
    <rect x="185" y="90" width="45" height="40" fill="#3C7E8E"/>
  </g>
  <rect x="140" y="90" width="90" height="40" rx="20" fill="none" stroke="#3F2C3F" stroke-width="2.5"/>

  <text x="185" y="178" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" fill="#3F2C3F">ReVia</text>

  <rect x="115" y="200" width="140" height="34" rx="17" fill="#3F2C3F"/>
  <text x="185" y="222" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Once daily</text>

  <text x="185" y="258" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#55585A">Taken by mouth</text>

  <!-- divider -->
  <circle cx="380" cy="150" r="24" fill="#E6D6E6"/>
  <text x="380" y="155" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3F2C3F">OR</text>

  <!-- Right card: injection -->
  <rect x="406" y="20" width="338" height="260" rx="18" fill="#FFFFFF" stroke="#E6D6E6" stroke-width="2"/>
  <text x="575" y="56" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#6B496B">LONG-ACTING INJECTION</text>

  <!-- syringe icon -->
  <rect x="540" y="97" width="18" height="26" rx="3" fill="#FFFFFF" stroke="#3F2C3F" stroke-width="2.5"/>
  <rect x="558" y="97" width="70" height="26" rx="4" fill="#FFFFFF" stroke="#3F2C3F" stroke-width="2.5"/>
  <rect x="563" y="102" width="45" height="16" fill="#3C7E8E"/>
  <rect x="628" y="105" width="26" height="10" fill="#3F2C3F"/>
  <polygon points="654,105 668,110 654,115" fill="#3F2C3F"/>

  <text x="575" y="178" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" fill="#3F2C3F">Vivitrol</text>

  <rect x="480" y="200" width="190" height="34" rx="17" fill="#3F2C3F"/>
  <text x="575" y="222" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">About every 4 weeks</text>

  <text x="575" y="258" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#55585A">Given by a clinician</text>
</svg>
