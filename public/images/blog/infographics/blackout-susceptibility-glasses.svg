<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Who is susceptible to alcohol blackouts</title>
  <desc id="desc">About 1 in 3 adults who drink and about 1 in 2 college students who drink report having experienced an alcohol blackout in the past year.</desc>

  <text x="450" y="44" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6B496B">WHO BLACKS OUT?</text>
  <text x="450" y="80" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="27" font-weight="700" fill="#3B1A3F">More common than most people think</text>

  <!-- glass A -->
  <g>
    <text x="270" y="128" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="42" font-weight="700" fill="#3E1E3E">1 in 3</text>

    <clipPath id="clipGlassA">
      <polygon points="190,150 350,150 330,380 210,380" />
    </clipPath>
    <rect x="170" y="303" width="200" height="80" fill="#3C7E8E" clip-path="url(#clipGlassA)" />
    <rect x="170" y="296" width="200" height="10" fill="#5FB0BE" clip-path="url(#clipGlassA)" />
    <rect x="212" y="330" width="20" height="20" rx="3" fill="#EAF6F7" opacity="0.75" clip-path="url(#clipGlassA)" />
    <rect x="248" y="345" width="18" height="18" rx="3" fill="#EAF6F7" opacity="0.6" clip-path="url(#clipGlassA)" />

    <polygon points="190,150 350,150 330,380 210,380" fill="none" stroke="#5A3F5A" stroke-width="6" stroke-linejoin="round" />
    <ellipse cx="270" cy="150" rx="80" ry="10" fill="none" stroke="#5A3F5A" stroke-width="4" opacity="0.5" />

    <text x="270" y="416" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="600" fill="#19211F">adults who drink</text>
    <text x="270" y="439" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">report a blackout in the past year</text>
  </g>

  <!-- glass B -->
  <g>
    <text x="630" y="128" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="42" font-weight="700" fill="#3E1E3E">1 in 2</text>

    <clipPath id="clipGlassB">
      <polygon points="550,150 710,150 690,380 570,380" />
    </clipPath>
    <rect x="530" y="265" width="200" height="118" fill="#3C7E8E" clip-path="url(#clipGlassB)" />
    <rect x="530" y="258" width="200" height="10" fill="#5FB0BE" clip-path="url(#clipGlassB)" />
    <rect x="572" y="290" width="20" height="20" rx="3" fill="#EAF6F7" opacity="0.75" clip-path="url(#clipGlassB)" />
    <rect x="608" y="308" width="18" height="18" rx="3" fill="#EAF6F7" opacity="0.6" clip-path="url(#clipGlassB)" />

    <polygon points="550,150 710,150 690,380 570,380" fill="none" stroke="#5A3F5A" stroke-width="6" stroke-linejoin="round" />
    <ellipse cx="630" cy="150" rx="80" ry="10" fill="none" stroke="#5A3F5A" stroke-width="4" opacity="0.5" />

    <text x="630" y="416" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="600" fill="#19211F">college students who drink</text>
    <text x="630" y="439" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">have experienced one</text>
  </g>

  <text x="450" y="486" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#55585A">Environmental factors (empty stomach, drinking fast, binge drinking) and genetic factors both raise the risk.</text>
</svg>
