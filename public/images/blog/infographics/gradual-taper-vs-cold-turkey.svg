<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="580" height="340" role="img" aria-labelledby="gtTitle">
  <title id="gtTitle">Gradual physician-supervised taper compared with stopping cold turkey</title>
  <rect x="2" y="2" width="576" height="336" rx="16" fill="#FBF6EC" stroke="#E6D6E6" stroke-width="2"/>

  <!-- panel divider -->
  <line x1="290" y1="40" x2="290" y2="300" stroke="#E6D6E6" stroke-width="2"/>

  <!-- PANEL A: cold turkey -->
  <text x="150" y="32" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="700" fill="#3F2C3F">Stopping cold turkey</text>

  <text x="90" y="60" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">Full dose</text>
  <circle cx="90" cy="70" r="4.5" fill="#3F2C3F"/>
  <path d="M90,70 L90,258" fill="none" stroke="#3F2C3F" stroke-width="4" stroke-linecap="round"/>
  <text x="105" y="170" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="600" fill="#3F2C3F">Abrupt stop</text>

  <!-- crisis burst icon -->
  <g transform="translate(90,268)">
    <path d="M0,-16 L4,-4 L16,-6 L7,3 L14,14 L2,9 L0,20 L-2,9 L-14,14 L-7,3 L-16,-6 L-4,-4 Z" fill="#6B496B"/>
  </g>
  <rect x="35" y="296" width="110" height="26" rx="7" fill="#E6D6E6"/>
  <text x="90" y="313" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="600" fill="#19211F">Crisis risk</text>

  <!-- PANEL B: gradual taper -->
  <text x="435" y="32" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2E6B78">Physician-supervised taper</text>

  <text x="330" y="60" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">Full dose</text>
  <path d="M330,70 H360 V110 H390 V150 H420 V190 H450 V230 H480 V258 H540"
        fill="none" stroke="#3C7E8E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="360" cy="110" r="4.5" fill="#3C7E8E"/>
  <circle cx="390" cy="150" r="4.5" fill="#3C7E8E"/>
  <circle cx="420" cy="190" r="4.5" fill="#3C7E8E"/>
  <circle cx="450" cy="230" r="4.5" fill="#3C7E8E"/>

  <rect x="380" y="296" width="110" height="26" rx="7" fill="#D6C2DA"/>
  <text x="435" y="313" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="600" fill="#19211F">24/7 monitored</text>
</svg>
