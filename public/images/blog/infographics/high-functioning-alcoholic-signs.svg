<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="hfs-title hfs-desc">
  <title id="hfs-title">Signs of high functioning alcoholism</title>
  <desc id="hfs-desc">Patterns of use: alcohol as a daily ritual, drinking more to feel the same effect, cutting back feels impossible. Emotional and cognitive signs: alcohol as an emotional crutch, distress when drinking isn't possible, minimizing the drinking, memory and cognitive changes.</desc>

  <rect width="760" height="380" rx="18" fill="#FBF6EC"/>

  <text x="40" y="36" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#3C7E8E">PATTERNS OF USE</text>
  <g font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#1E4650">
    <rect x="40" y="50" width="180" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="71">Alcohol as a daily ritual</text>
    <rect x="40" y="94" width="270" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="115">Drinking more for the same effect</text>
    <rect x="40" y="138" width="240" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="159">Cutting back feels impossible</text>
  </g>

  <line x1="380" y1="50" x2="380" y2="330" stroke="#E6D6E6" stroke-width="1.5" stroke-dasharray="3 5"/>

  <text x="416" y="36" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#6B496B">EMOTIONAL &amp; COGNITIVE SIGNS</text>
  <g font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#3B1A3F">
    <rect x="416" y="50" width="230" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="71">Alcohol as an emotional crutch</text>
    <rect x="416" y="94" width="290" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="115">Distress when drinking isn't possible</text>
    <rect x="416" y="138" width="200" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="159">Minimizing the drinking</text>
    <rect x="416" y="182" width="260" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="203">Memory problems, brain fog</text>
  </g>

  <rect x="40" y="192" width="270" height="106" rx="12" fill="#F5EFE0"/>
  <text x="58" y="216" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B4B1E">Not the same as willpower</text>
  <text x="58" y="238" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">Addiction is a disease. Repeatedly</text>
  <text x="58" y="256" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">setting and breaking rules around</text>
  <text x="58" y="274" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">drinking is a sign of dependence,</text>
  <text x="58" y="292" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" fill="#55585A">not a failure of character.</text>
</svg>
