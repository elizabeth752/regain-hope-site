<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', system-ui, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5A3F5A"/>
    </marker>
    <marker id="arrowhead2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6B496B"/>
    </marker>
  </defs>

  <rect width="900" height="430" rx="18" fill="#FBF6EC"/>

  <text x="40" y="34" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6B496B">WHERE CARE GOES AFTER DETOX</text>

  <!-- connecting arrows between main stages -->
  <line x1="205" y1="270" x2="270" y2="217" stroke="#5A3F5A" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="215" x2="490" y2="162" stroke="#5A3F5A" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="160" x2="710" y2="107" stroke="#5A3F5A" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- branch to dual-diagnosis -->
  <path d="M350,247 C350,290 350,300 350,330" fill="none" stroke="#6B496B" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrowhead2)"/>

  <!-- Node 1: Detox -->
  <rect x="55" y="238" width="150" height="64" rx="14" fill="#fff" stroke="#5A3F5A" stroke-width="2"/>
  <text x="130" y="264" font-size="14" font-weight="700" fill="#3B1A3F" text-anchor="middle">DETOX</text>
  <text x="130" y="282" font-size="10.5" fill="#55585A" text-anchor="middle">Gets you stable</text>

  <!-- Node 2: Residential Treatment -->
  <rect x="275" y="183" width="150" height="64" rx="14" fill="#E6D6E6" stroke="#5A3F5A" stroke-width="2"/>
  <text x="350" y="207" font-size="12.5" font-weight="700" fill="#3B1A3F" text-anchor="middle">RESIDENTIAL</text>
  <text x="350" y="222" font-size="12.5" font-weight="700" fill="#3B1A3F" text-anchor="middle">TREATMENT</text>
  <text x="350" y="238" font-size="10" fill="#55585A" text-anchor="middle">Structured, supported care</text>

  <!-- Node 3: Therapy + MAT -->
  <rect x="495" y="128" width="150" height="64" rx="14" fill="#E6D6E6" stroke="#5A3F5A" stroke-width="2"/>
  <text x="570" y="152" font-size="12.5" font-weight="700" fill="#3B1A3F" text-anchor="middle">THERAPY &#38; MAT</text>
  <text x="570" y="170" font-size="10" fill="#55585A" text-anchor="middle">Medication-assisted</text>
  <text x="570" y="183" font-size="10" fill="#55585A" text-anchor="middle">where appropriate</text>

  <!-- Node 4: Continuing Care -->
  <rect x="715" y="73" width="150" height="64" rx="14" fill="#3F2C3F" stroke="#3F2C3F" stroke-width="2"/>
  <text x="790" y="97" font-size="12.5" font-weight="700" fill="#F7EFDD" text-anchor="middle">CONTINUING CARE</text>
  <text x="790" y="114" font-size="9.5" fill="#D6C2DA" text-anchor="middle">Support through the</text>
  <text x="790" y="127" font-size="9.5" fill="#D6C2DA" text-anchor="middle">highest relapse-risk months</text>

  <!-- Branch node: Dual-Diagnosis Care -->
  <rect x="255" y="332" width="190" height="70" rx="14" fill="#fff" stroke="#6B496B" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="350" y="357" font-size="12.5" font-weight="700" fill="#6B496B" text-anchor="middle">DUAL-DIAGNOSIS CARE</text>
  <text x="350" y="374" font-size="10" fill="#55585A" text-anchor="middle">If anxiety or depression</text>
  <text x="350" y="388" font-size="10" fill="#55585A" text-anchor="middle">is also driving the drinking</text>
</svg>
