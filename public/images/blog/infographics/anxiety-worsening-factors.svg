<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Five factors that can worsen anxiety after drinking</title>
  <desc id="wf-desc">Alcohol quantity, frequent drinking, mood disorders, stress, and older age can each intensify anxiety after drinking alcohol.</desc>

  <g stroke="#C3A9C3" stroke-width="2.5">
    <line x1="280" y1="200" x2="280" y2="50"/>
    <line x1="280" y1="200" x2="423" y2="154"/>
    <line x1="280" y1="200" x2="368" y2="321"/>
    <line x1="280" y1="200" x2="192" y2="321"/>
    <line x1="280" y1="200" x2="137" y2="154"/>
  </g>

  <g font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="600" fill="#3B1A3F" text-anchor="middle">
    <circle cx="280" cy="50" r="42" fill="#FBF6EC" stroke="#5A3F5A" stroke-width="2"/>
    <text x="280" y="46"><tspan x="280" dy="0">Alcohol</tspan><tspan x="280" dy="16">quantity</tspan></text>

    <circle cx="423" cy="154" r="42" fill="#FBF6EC" stroke="#5A3F5A" stroke-width="2"/>
    <text x="423" y="150"><tspan x="423" dy="0">Frequent</tspan><tspan x="423" dy="16">drinking</tspan></text>

    <circle cx="368" cy="321" r="42" fill="#FBF6EC" stroke="#5A3F5A" stroke-width="2"/>
    <text x="368" y="317"><tspan x="368" dy="0">Mood</tspan><tspan x="368" dy="16">disorders</tspan></text>

    <circle cx="192" cy="321" r="42" fill="#FBF6EC" stroke="#5A3F5A" stroke-width="2"/>
    <text x="192" y="317"><tspan x="192" dy="0">Stress</tspan><tspan x="192" dy="16">(cortisol)</tspan></text>

    <circle cx="137" cy="154" r="42" fill="#FBF6EC" stroke="#5A3F5A" stroke-width="2"/>
    <text x="137" y="150"><tspan x="137" dy="0">Older</tspan><tspan x="137" dy="16">age</tspan></text>
  </g>

  <circle cx="280" cy="200" r="56" fill="#3F2C3F"/>
  <text x="280" y="196" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF6EC"><tspan x="280" dy="0">Worsens</tspan><tspan x="280" dy="18">Anxiety</tspan></text>
</svg>
