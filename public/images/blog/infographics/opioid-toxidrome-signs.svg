<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="ots-title ots-desc">
  <title id="ots-title">Overdose signs vs. withdrawal signs</title>
  <desc id="ots-desc">Overdose signs, a medical emergency: slowed breathing, slowed heart rate, sedation and confusion, seizures, coma. Withdrawal signs: anxiety and agitation, high blood pressure and rapid heart rate, sweating, nausea and diarrhea, tremors.</desc>

  <rect width="760" height="340" rx="18" fill="#FBF6EC"/>
  <text x="380" y="34" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#6B496B">HIGH DOSES PRODUCE AN OPIOID-LIKE PICTURE, IN BOTH DIRECTIONS</text>

  <!-- left: overdose, emergency dark panel -->
  <rect x="30" y="55" width="335" height="260" rx="14" fill="#341A38"/>
  <text x="197" y="88" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F7EFDD">OVERDOSE</text>
  <text x="197" y="105" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11" fill="#C3A9C3">A medical emergency</text>

  <!-- overdose rows -->
  <g font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#F7EFDD">
    <circle cx="64" cy="140" r="14" fill="#4A2A4E"/>
    <path d="M58,140 q6,-10 12,0 q6,10 12,0" fill="none" stroke="#F7EFDD" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="145">Slowed breathing</text>

    <circle cx="64" cy="176" r="14" fill="#4A2A4E"/>
    <path d="M57,176 h6 l3,-8 l4,16 l3,-8 h6" fill="none" stroke="#F7EFDD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="181">Slowed heart rate</text>

    <circle cx="64" cy="212" r="14" fill="#4A2A4E"/>
    <text x="58" y="217" font-size="11" fill="#F7EFDD">Zzz</text>
    <text x="88" y="217">Sedation, confusion</text>

    <circle cx="64" cy="248" r="14" fill="#4A2A4E"/>
    <path d="M56,252 l6,-12 l4,8 l4,-8 l6,12" fill="none" stroke="#F7EFDD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="253">Seizures</text>

    <circle cx="64" cy="284" r="14" fill="#4A2A4E"/>
    <path d="M57,284 a7,5 0 1,0 14,0 a7,5 0 1,0 -14,0" fill="none" stroke="#F7EFDD" stroke-width="2"/>
    <text x="88" y="289">Coma</text>
  </g>

  <!-- right: withdrawal, light panel -->
  <rect x="395" y="55" width="335" height="260" rx="14" fill="#fff" stroke="#E6D6E6" stroke-width="1.5"/>
  <text x="562" y="88" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="700" fill="#3B1A3F">WITHDRAWAL</text>
  <text x="562" y="105" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="11" fill="#55585A">Uncomfortable, opioid-like</text>

  <g font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#3B1A3F">
    <circle cx="429" cy="140" r="14" fill="#EAF3F4"/>
    <path d="M422,144 q7,-10 14,0" fill="none" stroke="#3C7E8E" stroke-width="2" stroke-linecap="round"/>
    <text x="453" y="145">Anxiety, agitation</text>

    <circle cx="429" cy="176" r="14" fill="#EAF3F4"/>
    <path d="M422,176 h6 l3,-8 l4,16 l3,-8 h6" fill="none" stroke="#3C7E8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="453" y="181">Rapid heart &amp; BP rise</text>

    <circle cx="429" cy="212" r="14" fill="#EAF3F4"/>
    <path d="M429,204 c4,6 4,10 0,14 c-4,-4 -4,-8 0,-14 z" fill="none" stroke="#3C7E8E" stroke-width="2"/>
    <text x="453" y="217">Sweating</text>

    <circle cx="429" cy="248" r="14" fill="#EAF3F4"/>
    <path d="M422,248 q7,8 14,0" fill="none" stroke="#3C7E8E" stroke-width="2" stroke-linecap="round"/>
    <text x="453" y="253">Nausea, diarrhea</text>

    <circle cx="429" cy="284" r="14" fill="#EAF3F4"/>
    <path d="M422,284 l4,-6 l4,6 l4,-6 l4,6" fill="none" stroke="#3C7E8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="453" y="289">Tremors</text>
  </g>
</svg>
