<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="vs-title vs-desc">
  <title id="vs-title">Ozempic alone compared with structured AUD treatment</title>
  <desc id="vs-desc">Ozempic may reduce cravings but is not FDA-approved for alcohol use disorder, does not address trauma or co-occurring mental health conditions, and cravings often return when it is stopped. Structured treatment includes medically supervised detox, FDA-approved medication for AUD, therapy for underlying causes, and ongoing recovery support.</desc>

  <rect x="2" y="2" width="756" height="416" rx="18" fill="#FBF6EC" stroke="#E6D6E6" stroke-width="2"/>
  <line x1="380" y1="40" x2="380" y2="396" stroke="#E6D6E6" stroke-width="2"/>

  <!-- PANEL A: Ozempic alone -->
  <text x="190" y="36" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="700" fill="#3F2C3F">Ozempic Alone</text>

  <circle cx="44" cy="70" r="11" fill="none" stroke="#3C7E8E" stroke-width="2.5"/>
  <path d="M38,70 L42,75 L51,64" fill="none" stroke="#3C7E8E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">May reduce cravings for</text>
  <text x="64" y="84" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">alcohol and food</text>

  <circle cx="44" cy="124" r="11" fill="none" stroke="#6B496B" stroke-width="2.5"/>
  <path d="M39,119 L49,129 M49,119 L39,129" stroke="#6B496B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="64" y="120" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Not FDA-approved to</text>
  <text x="64" y="138" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">treat alcohol use disorder</text>

  <circle cx="44" cy="178" r="11" fill="none" stroke="#6B496B" stroke-width="2.5"/>
  <path d="M39,173 L49,183 M49,173 L39,183" stroke="#6B496B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="64" y="174" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Doesn't address trauma or</text>
  <text x="64" y="192" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">co-occurring mental health</text>

  <circle cx="44" cy="232" r="11" fill="none" stroke="#6B496B" stroke-width="2.5"/>
  <path d="M39,227 L49,237 M49,227 L39,237" stroke="#6B496B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="64" y="228" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Cravings often return</text>
  <text x="64" y="246" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">once it's stopped</text>

  <rect x="24" y="278" width="332" height="100" rx="12" fill="#E6D6E6"/>
  <text x="190" y="308" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3F2C3F">Evidence is still early</text>
  <text x="190" y="330" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#55585A">
    <tspan x="190" dy="0">Research so far is limited in</tspan>
    <tspan x="190" dy="18">scope — not enough to use it</tspan>
    <tspan x="190" dy="18">as a stand-alone treatment</tspan>
  </text>

  <!-- PANEL B: Structured treatment -->
  <text x="570" y="36" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="700" fill="#2E6B78">Structured AUD Treatment</text>

  <circle cx="424" cy="70" r="11" fill="#3C7E8E"/>
  <path d="M418,70 L422,75 L431,64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Medically supervised</text>
  <text x="444" y="84" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">detox and withdrawal care</text>

  <circle cx="424" cy="124" r="11" fill="#3C7E8E"/>
  <path d="M418,124 L422,129 L431,118" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="120" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">FDA-approved medication</text>
  <text x="444" y="138" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">for AUD (MAT)</text>

  <circle cx="424" cy="178" r="11" fill="#3C7E8E"/>
  <path d="M418,178 L422,183 L431,172" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="174" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Therapy for the causes</text>
  <text x="444" y="192" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">driving the addiction</text>

  <circle cx="424" cy="232" r="11" fill="#3C7E8E"/>
  <path d="M418,232 L422,237 L431,226" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="228" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">Ongoing support for</text>
  <text x="444" y="246" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#19211F">lasting recovery</text>

  <rect x="404" y="278" width="332" height="100" rx="12" fill="#EAF3F4"/>
  <text x="570" y="308" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2E6B78">The established path</text>
  <text x="570" y="330" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#55585A">
    <tspan x="570" dy="0">Built on decades of evidence</tspan>
    <tspan x="570" dy="18">and delivered by licensed</tspan>
    <tspan x="570" dy="18">clinicians, start to finish</tspan>
  </text>
</svg>
