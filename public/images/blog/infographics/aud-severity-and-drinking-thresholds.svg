<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="aud-title aud-desc">
  <title id="aud-title">AUD severity by DSM-5 criteria met, and NIAAA heavy drinking thresholds</title>
  <desc id="aud-desc">Meeting 2 or more of 11 DSM-5 criteria within 12 months establishes an alcohol use disorder diagnosis: 2 to 3 criteria is mild, 4 to 5 is moderate, 6 or more is severe. NIAAA defines heavy drinking as more than 4 drinks a day or 14 a week for men, and more than 3 a day or 7 a week for women.</desc>

  <rect width="900" height="400" rx="18" fill="#FBF6EC"/>

  <text x="40" y="38" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#3B1A3F">AUD SEVERITY, BY DSM-5 CRITERIA MET (OF 11)</text>
  <text x="40" y="58" font-family="'Poppins', system-ui, sans-serif" font-size="12" fill="#55585A">Meeting 2+ criteria within 12 months establishes the diagnosis.</text>

  <!-- scale -->
  <g transform="translate(40,90)">
    <!-- zone bands: 0-1 none, 2-3 mild, 4-5 moderate, 6-11 severe, track width 560 for 11 units -->
    <rect x="0" y="0" width="102" height="46" rx="8" fill="#E9E2D8"/>
    <rect x="102" y="0" width="102" height="46" fill="#BFDAE0"/>
    <rect x="204" y="0" width="102" height="46" fill="#8FB9C4"/>
    <rect x="306" y="0" width="254" height="46" rx="8" fill="#3C7E8E"/>

    <g font-family="'Poppins', system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
      <text x="51" y="29" fill="#8A8570">0&#8211;1</text>
      <text x="153" y="29" fill="#1E4650">2&#8211;3</text>
      <text x="255" y="29" fill="#0F2B31" >4&#8211;5</text>
      <text x="433" y="29" fill="#FBF6EC">6&#8211;11</text>
    </g>

    <g font-family="'Poppins', system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3B1A3F">
      <text x="51" y="70">No AUD</text>
      <text x="153" y="70">Mild</text>
      <text x="255" y="70">Moderate</text>
      <text x="433" y="70">Severe</text>
    </g>

    <!-- diagnosis threshold marker -->
    <line x1="102" y1="-14" x2="102" y2="46" stroke="#C77B2B" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="102" y="-20" font-family="'Poppins', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#C77B2B" text-anchor="middle">Diagnosis threshold</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="82" x2="600" y2="360" stroke="#E6D6E6" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- NIAAA heavy drinking panel -->
  <text x="632" y="98" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#6B496B">NIAAA HEAVY DRINKING</text>

  <g font-family="'Poppins', system-ui, sans-serif">
    <rect x="632" y="116" width="232" height="90" rx="12" fill="#F1E6EF"/>
    <text x="650" y="142" font-size="13" font-weight="700" fill="#3B1A3F">Men</text>
    <text x="650" y="164" font-size="12.5" fill="#3B1A3F">&gt;4 drinks/day</text>
    <text x="650" y="184" font-size="12.5" fill="#3B1A3F">or &gt;14/week</text>

    <rect x="632" y="216" width="232" height="90" rx="12" fill="#EAF3F4"/>
    <text x="650" y="242" font-size="13" font-weight="700" fill="#1E4650">Women</text>
    <text x="650" y="264" font-size="12.5" fill="#1E4650">&gt;3 drinks/day</text>
    <text x="650" y="284" font-size="12.5" fill="#1E4650">or &gt;7/week</text>
  </g>

  <text x="632" y="336" font-family="'Poppins', system-ui, sans-serif" font-size="11" fill="#55585A">Above these levels, risk of AUD and</text>
  <text x="632" y="352" font-family="'Poppins', system-ui, sans-serif" font-size="11" fill="#55585A">related harm rises&#8212;whether or not</text>
  <text x="632" y="368" font-family="'Poppins', system-ui, sans-serif" font-size="11" fill="#55585A">someone still "functions" day to day.</text>
</svg>
