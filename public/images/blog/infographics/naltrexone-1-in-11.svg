<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="ei-title ei-desc">
  <title id="ei-title">Naltrexone effectiveness: roughly 1 in 11</title>
  <desc id="ei-desc">On average, roughly one in eleven people treated with naltrexone avoids a return to heavy drinking who otherwise would not have.</desc>

  <defs>
    <symbol id="person" viewBox="0 0 32 50">
      <circle cx="16" cy="12" r="9"/>
      <path d="M 2,50 C 2,26 30,26 30,50 Z"/>
    </symbol>
  </defs>

  <text x="72" y="118" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="50" font-weight="700" fill="#3F2C3F">1 in 11</text>
  <text x="72" y="150" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="14" fill="#55585A">
    <tspan x="72" dy="0">avoids a return to</tspan>
    <tspan x="72" dy="18">heavy drinking</tspan>
  </text>

  <line x1="178" y1="30" x2="178" y2="230" stroke="#E6D6E6" stroke-width="1.5"/>

  <!-- row 1: 6 muted + 1 highlighted = 7 -->
  <use href="#person" x="214" y="55" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="276" y="55" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="400" y="55" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="462" y="55" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="524" y="55" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="586" y="55" width="32" height="50" fill="#D6C2DA"/>

  <!-- the highlighted "1" -->
  <circle cx="354" cy="80" r="30" fill="#EAF3F4"/>
  <use href="#person" x="338" y="55" width="32" height="50" fill="#3C7E8E"/>

  <!-- row 2: 4 muted -->
  <use href="#person" x="276" y="150" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="338" y="150" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="400" y="150" width="32" height="50" fill="#D6C2DA"/>
  <use href="#person" x="462" y="150" width="32" height="50" fill="#D6C2DA"/>

  <text x="750" y="240" text-anchor="end" font-family="'Poppins', system-ui, sans-serif" font-size="12" fill="#55585A">on average, among people treated</text>
</svg>
