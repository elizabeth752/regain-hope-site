<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="pms-title pms-desc">
  <title id="pms-title">Physical and behavioral signs of pain medication addiction</title>
  <desc id="pms-desc">Physical signs: drowsiness or slurred speech, sweating, constricted pupils, nausea and vomiting, constipation, itchy skin, confusion. Behavioral signs: mood swings, social isolation, hiding or hoarding medication, taking higher doses than prescribed, changes in sleeping and eating, declining performance at work or school, neglecting hygiene.</desc>

  <rect width="760" height="360" rx="18" fill="#FBF6EC"/>

  <text x="40" y="36" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#3C7E8E">PHYSICAL SIGNS</text>
  <g font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#3B1A3F">
    <rect x="40" y="50" width="150" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="71">Drowsiness, slurred speech</text>
    <rect x="40" y="94" width="104" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="115">Sweating</text>
    <rect x="154" y="94" width="150" height="34" rx="17" fill="#EAF3F4"/><text x="174" y="115">Constricted pupils</text>
    <rect x="40" y="138" width="150" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="159">Nausea, vomiting</text>
    <rect x="200" y="138" width="124" height="34" rx="17" fill="#EAF3F4"/><text x="220" y="159">Constipation</text>
    <rect x="40" y="182" width="104" height="34" rx="17" fill="#EAF3F4"/><text x="60" y="203">Itchy skin</text>
    <rect x="154" y="182" width="110" height="34" rx="17" fill="#EAF3F4"/><text x="174" y="203">Confusion</text>
  </g>

  <line x1="380" y1="50" x2="380" y2="330" stroke="#E6D6E6" stroke-width="1.5" stroke-dasharray="3 5"/>

  <text x="416" y="36" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#6B496B">BEHAVIORAL SIGNS</text>
  <g font-family="'Poppins', system-ui, sans-serif" font-size="12.5" fill="#3B1A3F">
    <rect x="416" y="50" width="124" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="71">Mood swings</text>
    <rect x="416" y="94" width="150" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="115">Social isolation</text>
    <rect x="416" y="138" width="220" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="159">Hiding or hoarding medication</text>
    <rect x="416" y="182" width="270" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="203">Taking higher doses than prescribed</text>
    <rect x="416" y="226" width="240" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="247">Changes in sleep and eating</text>
    <rect x="416" y="270" width="270" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="291">Declining work or school performance</text>
    <rect x="416" y="314" width="220" height="34" rx="17" fill="#F1E6EF"/><text x="436" y="335">Neglecting personal hygiene</text>
  </g>
</svg>
