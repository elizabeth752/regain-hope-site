<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="tpd-title tpd-desc">
  <title id="tpd-title">Who calls poison control about tianeptine</title>
  <desc id="tpd-desc">82% of calls to poison centers about tianeptine involve men. Nearly 57% involve people ages 21 to 40.</desc>

  <rect width="760" height="260" rx="18" fill="#FBF6EC"/>
  <text x="380" y="34" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#6B496B">WHO CALLS POISON CONTROL ABOUT TIANEPTINE</text>

  <!-- dial 1: 82% men -->
  <path d="M 135,170 A 85,85 0 0 1 305,170" fill="none" stroke="#E6D6E6" stroke-width="16" stroke-linecap="round"/>
  <path d="M 135,170 A 85,85 0 0 1 291.7,124.5" fill="none" stroke="#3C7E8E" stroke-width="16" stroke-linecap="round"/>
  <text x="220" y="150" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="700" fill="#3B1A3F">82%</text>
  <text x="220" y="208" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#55585A">
    <tspan x="220" dy="0">of calls</tspan>
    <tspan x="220" dy="16">involve men</tspan>
  </text>

  <line x1="380" y1="70" x2="380" y2="220" stroke="#E6D6E6" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- dial 2: 57% ages 21-40 -->
  <path d="M 455,170 A 85,85 0 0 1 625,170" fill="none" stroke="#E6D6E6" stroke-width="16" stroke-linecap="round"/>
  <path d="M 455,170 A 85,85 0 0 1 558.5,87.1" fill="none" stroke="#3C7E8E" stroke-width="16" stroke-linecap="round"/>
  <text x="540" y="150" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="700" fill="#3B1A3F">57%</text>
  <text x="540" y="208" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13" fill="#55585A">
    <tspan x="540" dy="0">are ages</tspan>
    <tspan x="540" dy="16">21&#8211;40</tspan>
  </text>
</svg>
