<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mdsTitle mdsDesc">
  <title id="mdsTitle">Medical detox for weed has three main parts</title>
  <desc id="mdsDesc">Assessment, where the detox team evaluates physical and mental health; stabilization, where therapy and wellness activities keep cravings and withdrawal in check; and preparation, where the team recommends next steps for ongoing care.</desc>

  <text x="380" y="40" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="700" fill="#3B1A3F">Medical Detox for Weed, Step by Step</text>
  <text x="380" y="66" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="15" fill="#55585A">Typically lasts 3&#8211;10 days, under 24/7 supervision</text>

  <!-- connecting line -->
  <line x1="130" y1="150" x2="630" y2="150" stroke="#C3A9C3" stroke-width="3" stroke-dasharray="2,12" opacity="0.7"/>

  <!-- step 1 -->
  <g transform="translate(130,150)">
    <circle r="46" fill="#3C7E8E"/>
    <text y="10" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
  </g>
  <text x="130" y="224" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="17" font-weight="700" fill="#3B1A3F">Assessment</text>
  <text x="130" y="248" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">Physical &amp; mental</text>
  <text x="130" y="266" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">health evaluation</text>

  <!-- step 2 -->
  <g transform="translate(380,150)">
    <circle r="46" fill="#5A3F5A"/>
    <text y="10" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
  </g>
  <text x="380" y="224" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="17" font-weight="700" fill="#3B1A3F">Stabilization</text>
  <text x="380" y="248" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">Therapy, wellness &amp;</text>
  <text x="380" y="266" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">medication when prescribed</text>

  <!-- step 3 -->
  <g transform="translate(630,150)">
    <circle r="46" fill="#C77B2B"/>
    <text y="10" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text>
  </g>
  <text x="630" y="224" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="17" font-weight="700" fill="#3B1A3F">Preparation</text>
  <text x="630" y="248" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">Plan for ongoing</text>
  <text x="630" y="266" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-size="13.5" fill="#55585A">care after detox</text>
</svg>
